Hell_GatherHold=[Địa Ngục] {0}: đang chờ khi người thu thập còn ở ngoài, để giữ nguyên trang bị thu thập. Hãy chọn "{1}" trong Sự Kiện Địa Ngục để làm sự kiện với trang bị thu thập
Hell_NothingToTrain=[Địa Ngục] {0}: không có gì để huấn luyện. Hãy đặt một loại quân có mục tiêu lớn hơn 0 cho chương này trong tab Quân Đội
