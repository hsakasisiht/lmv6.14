Hell_AutoTip=Trong một Sự Kiện Địa Ngục thuộc loại đã chọn, giữ hàng đợi đó luôn bận (huấn luyện, nghiên cứu, xây dựng, kết hợp khế ước, bẫy, săn) cho đến khi đạt giai đoạn mục tiêu, kể cả khi tùy chọn đó đang tắt ở nơi khác. Sự kiện huấn luyện sẽ huấn luyện đầy trại lính mỗi lần (các loại quân từ tab Quân Đội, không theo giới hạn mỗi đợt và mục tiêu của tab đó).
