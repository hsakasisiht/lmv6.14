Hell_MedalFilter=Chỉ cho huy chương của
Hell_MedalFilterTip=Chỉ chạy Sự Kiện Địa Ngục khi phần thưởng, tính đến giai đoạn mục tiêu, có huy chương của một trong các anh hùng này. Để trống ô này và vật liệu để chạy mọi Sự Kiện Địa Ngục. Nhiệm vụ "Hoàn thành giai đoạn 3" của Đại Hội Bang Phái hoặc Trao Đổi vẫn được chạy. Liệt kê các anh hùng có huy chương từng xuất hiện trong Sự Kiện Địa Ngục trong 60 ngày qua (tất cả anh hùng cho đến khi bot thấy phần thưởng của một Sự Kiện Địa Ngục).
Hell_Materials=hoặc vật liệu
Hell_MaterialsTip=Hoặc chạy Sự Kiện Địa Ngục có phần thưởng, tính đến giai đoạn mục tiêu, chứa một trong các vật liệu này. Khi đã chọn huy chương hoặc vật liệu, mọi Sự Kiện Địa Ngục khác sẽ bị bỏ qua.
Hell_MedalAny=Bất kỳ anh hùng
