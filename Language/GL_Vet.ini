Hell_GeneralSpeedUps=Cả tăng tốc chung
Hell_GeneralSpeedUpsTip=Cho phép tăng tốc của Sự Kiện Địa Ngục dùng tăng tốc chung cho huấn luyện, nghiên cứu và bẫy, kể cả khi "Chỉ dùng tăng tốc thường cho xây dựng" giữ chúng lại cho xây dựng.
Hell_WhileGathering=Làm việc khi đang thu thập
Hell_WhileGatheringTip=Khi đang mặc trang bị thu thập, bot chờ người thu thập quay về rồi mới huấn luyện, nghiên cứu, xây dựng, kết hợp khế ước hoặc săn, để giữ nguyên trang bị. Trong Sự Kiện Địa Ngục, bot vẫn làm sự kiện đó và giữ nguyên trang bị thu thập.
Hell_FollowArmyTargets=Huấn luyện theo mục tiêu Quân Đội trong Sự Kiện Địa Ngục
Hell_FollowArmyTargetsTip=Trong Sự Kiện Địa Ngục huấn luyện, dừng ở mục tiêu lính của thẻ Quân Đội thay vì huấn luyện đầy doanh trại mỗi loại mục tiêu để đạt điểm tối đa.
