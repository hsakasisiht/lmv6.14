Hell_Auto=Eventi infernali automatici
Hell_AutoTip=Durante un evento infernale di un tipo spuntato, tiene occupata quella coda (addestramento, ricerca, costruzione, fusione patti, trappole, caccia) fino al raggiungimento della fase obiettivo, anche se quell'opzione è disattivata altrove. Un evento di addestramento addestra ogni volta una caserma piena (i tipi di truppe della scheda Esercito, senza il suo limite per lotto né gli obiettivi).
Hell_TargetPhase=fino alla fase
Hell_UseSpeedUps=Usa accelerazioni per gli eventi infernali
Hell_UseSpeedUpsTip=Accelera la coda corrispondente così il lavoro finisce entro l'evento, un elemento alla volta, e si ferma una volta raggiunta la fase obiettivo.
Hell_GeneralSpeedUps=Anche accelerazioni generali
Hell_GeneralSpeedUpsTip=Permette alle accelerazioni degli eventi infernali di usare accelerazioni generali per addestramento, ricerca e trappole, anche quando "Usa Acceleratori normali solo per Costruire" le riserva alla costruzione.
Hell_WhileGathering=Lavora durante la raccolta
Hell_WhileGatheringTip=Con l'equipaggiamento di raccolta attivo, il bot aspetta il ritorno dei raccoglitori prima di addestrare, ricercare, costruire, fondere patti o cacciare, così l'equipaggiamento resta attivo. Durante un evento infernale lavora comunque l'evento e mantiene l'equipaggiamento di raccolta.
Hell_FollowArmyTargets=Addestra secondo gli obiettivi Esercito durante l'Evento infernale
Hell_FollowArmyTargetsTip=Durante un evento di addestramento infernale, fermati agli obiettivi di truppe della scheda Esercito invece di addestrare una caserma piena di ogni tipo richiesto per il massimo dei punti.
Hell_KindTrain=Addestramento
Hell_KindResearch=Ricerca
Hell_KindBuild=Costruzione
Hell_KindPacts=Fusione patti
Hell_KindTraps=Trappole
Hell_KindHunt=Caccia ai mostri
Hell_SpeedUp=[Infernale] {0}: accelerazione (fase {1} di {2})
Hell_MedalFilter=Solo per medaglie di
Hell_MedalFilterTip=Esegue un evento infernale solo se le sue ricompense, fino alla fase obiettivo, includono una medaglia di uno di questi eroi. Lascia vuoti questo campo e i materiali per eseguire ogni evento infernale. Una missione "Completa la fase 3" della Festa delle Gilde o Scambio viene eseguita comunque. Elenca gli eroi le cui medaglie gli eventi infernali hanno offerto negli ultimi 60 giorni (tutti gli eroi finché il bot non ha visto le ricompense di un evento infernale).
Hell_Materials=o materiali
Hell_MaterialsTip=Oppure esegue un evento infernale le cui ricompense, fino alla fase obiettivo, includono uno di questi materiali. Con una medaglia o un materiale scelto, tutti gli altri eventi infernali vengono saltati.
Hell_MedalAny=Qualsiasi eroe
Hell_SkipNoMedal=[Infernale] {0}: nessuna medaglia o materiale desiderato nelle ricompense, salto questo
Hell_MedalFound=[Infernale] {0}: le ricompense includono {1}
Hell_GemFinish=Completa le costruzioni con le gemme
Hell_GemFinishMax=gemme max per costruzione
Hell_GemFinishTip=Durante un evento infernale di costruzione, una costruzione che sarebbe ancora in corso alla fine dell'evento viene completata con le gemme, se non costa più di questo limite. Richiede "Usa Gemme" in Spese. Le accelerazioni (se spuntate) vengono usate prima.
Hell_GemFinished=[Infernale] {0}: {1} completato con {2} gemme (fase {3} di {4})
Hell_GemFinishOverLimit=[Infernale] {0}: {1} richiede {2} gemme per completare, più del tuo limite di {3}
Hell_GemFinishNoGems=[Infernale] {0}: gemme insufficienti per completare {1} (ne servono {2})
Hell_GemFinishNotAllowed=[Infernale] {0}: {1} non viene completato con le gemme, "Usa Gemme" è disattivato in Spese
Hell_GatherHold=[Infernale] {0}: in attesa mentre i raccoglitori sono fuori, così l'equipaggiamento di raccolta resta attivo. Spunta "{1}" in Eventi infernali per lavorare l'evento con l'equipaggiamento di raccolta
Hell_NothingToTrain=[Infernale] {0}: niente da addestrare. Imposta un tipo di truppa con obiettivo superiore a 0 per questo capitolo nella scheda Esercito
Hell_NoSpeedUps=[Infernale] {0}: nessuna accelerazione nella borsa adatta a questa coda
Hell_SpeedUpsShort=[Infernale] {0}: nessuna accelerazione, mancano {1} e anche con le accelerazioni finirebbe dopo la fine dell'evento ({2})
Hell_NoSpeedUpsGeneralKept=[Infernale] {0}: nessuna accelerazione di questo tipo nella borsa, e le accelerazioni generali sono riservate alla costruzione. Spunta "{1}" in Eventi infernali per usarle
Exchange_AutomateQuests=Automatizza le missioni
Quest_AutomateTip=Finché la missione è attiva il bot ci lavora: addestra, ricerca, fonde patti o pietre abilità, forgia, caccia, usa Stelle Sacre e Gettoni Fortunati, esegue Labirinto/Magnate, apre forzieri degli artefatti, completa le missioni gestione/di gilda e gli eventi infernali, anche se quelle opzioni sono disattivate.
Quest_UseSpeedUps=Lascia che le missioni usino accelerazioni
Quest_UseSpeedUpsTip=Per le missioni Usa accelerazioni / Accelera fusione, accelera la coda di ricerca, addestramento, costruzione o fusione.
Quest_TypesTab=Automatizza le missioni
Quest_TypesHint=Togli la spunta a un tipo di missione per lasciarlo a te. Il limite dipende dal tipo: per gli oggetti è quanti il bot ne tiene senza usarli, per le missioni sui mostri è la % di energia che la caccia aspetta. Vale anche per le missioni della Festa delle Gilde che il bot accetta.
