GuildFest_StrictSlotOrder=Prima 200% poi 120%
GuildFest_StrictSlotOrderTip=Prende prima le missioni per lo slot 200%, poi lo slot 120%, poi la bacheca della gilda. Abbinalo a Prima da solo per evitare la bacheca finché restano tentativi bonus.
