Hell_SpeedUp=[Piekło] {0}: przyspieszanie (faza {1} z {2})
Hell_MedalFilter=Tylko dla medali
Hell_MedalFilterTip=Uruchamia wydarzenie piekielne tylko wtedy, gdy jego nagrody, aż do fazy docelowej, zawierają medal jednego z tych bohaterów. Zostaw to pole i materiały puste, aby uruchamiać każde wydarzenie piekielne. Misja "Ukończ fazę 3" Święta gildii lub Wymiany nadal się uruchamia. Wyświetla bohaterów, których medale oferowały wydarzenia piekielne w ostatnich 60 dniach (wszyscy bohaterowie, dopóki bot nie zobaczy nagród wydarzenia piekielnego).
Hell_Materials=lub materiałów
Hell_MaterialsTip=Albo uruchamia wydarzenie piekielne, którego nagrody, aż do fazy docelowej, zawierają jeden z tych materiałów. Gdy wybrano medal lub materiał, wszystkie inne wydarzenia piekielne są pomijane.
Hell_MedalAny=Dowolny bohater
Hell_SkipNoMedal=[Piekło] {0}: brak żądanego medalu ani materiału w nagrodach, pomijam
Hell_MedalFound=[Piekło] {0}: nagrody zawierają {1}
Hell_GemFinish=Kończ budowy klejnotami
Hell_GemFinishMax=maks. klejnotów na budowę
Hell_GemFinishTip=Podczas wydarzenia piekielnego budowania budowa, która trwałaby jeszcze po końcu wydarzenia, zostaje ukończona klejnotami, jeśli kosztuje nie więcej niż ten limit. Wymaga "Użyj klejnotów" w Wydatkach. Przyspieszenia (jeśli zaznaczone) są używane najpierw.
Hell_GemFinished=[Piekło] {0}: ukończono {1} za {2} klejnotów (faza {3} z {4})
Hell_GemFinishOverLimit=[Piekło] {0}: {1} wymaga {2} klejnotów do ukończenia, więcej niż twój limit {3}
Hell_GemFinishNoGems=[Piekło] {0}: za mało klejnotów, aby ukończyć {1} (potrzeba {2})
Hell_GemFinishNotAllowed=[Piekło] {0}: {1} nie zostanie ukończone klejnotami, "Użyj klejnotów" jest wyłączone w Wydatkach
Hell_GatherHold=[Piekło] {0}: czekam, gdy zbieracze są poza bazą, aby wyposażenie do eksploatacji zostało założone. Zaznacz "{1}" w Wydarzeniach piekielnych, aby wykonywać wydarzenie w wyposażeniu do eksploatacji
Hell_NothingToTrain=[Piekło] {0}: nie ma czego szkolić. Ustaw typ wojsk z celem powyżej 0 dla tego rozdziału w zakładce Armia
Hell_NoSpeedUps=[Piekło] {0}: brak w torbie przyspieszeń pasujących do tej kolejki
Hell_SpeedUpsShort=[Piekło] {0}: bez przyspieszania, zostało {1}, a nawet z przyspieszeniami trwałoby to po końcu wydarzenia ({2})
Hell_NoSpeedUpsGeneralKept=[Piekło] {0}: brak w torbie przyspieszeń tego rodzaju, a ogólne przyspieszenia są zachowane na budowanie. Zaznacz "{1}" w Wydarzeniach piekielnych, aby ich użyć
