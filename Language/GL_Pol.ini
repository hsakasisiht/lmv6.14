Hell_Auto=Automatyczne wydarzenia piekielne
Hell_AutoTip=Podczas wydarzenia piekielnego zaznaczonego rodzaju utrzymuje zajętą tę kolejkę (szkolenie, badania, budowanie, łączenie paktów, pułapki, polowanie) aż do osiągnięcia fazy docelowej, nawet jeśli ta opcja jest gdzie indziej wyłączona. Wydarzenie szkoleniowe szkoli za każdym razem pełne koszary (typy wojsk z zakładki Armia, bez jej limitu partii i celów).
Hell_TargetPhase=do fazy
Hell_UseSpeedUps=Używaj przyspieszeń w wydarzeniach piekielnych
Hell_UseSpeedUpsTip=Przyspiesza odpowiednią kolejkę, aby praca skończyła się w trakcie wydarzenia, po jednym elemencie, i zatrzymuje się po osiągnięciu fazy docelowej.
Hell_GeneralSpeedUps=Także ogólne przyspieszenia
Hell_GeneralSpeedUpsTip=Pozwala przyspieszeniom wydarzeń piekielnych używać ogólnych przyspieszeń do szkolenia, badań i pułapek, nawet gdy "Użyj zwykłych przyspieszeń tylko do przyspieszenia budowania" zachowuje je na budowanie.
Hell_WhileGathering=Pracuj podczas zbierania
Hell_WhileGatheringTip=Z założonym wyposażeniem do eksploatacji bot czeka na powrót zbieraczy przed szkoleniem, badaniami, budowaniem, łączeniem paktów lub polowaniem, aby wyposażenie zostało założone. Podczas wydarzenia piekielnego i tak je wykonuje i zachowuje wyposażenie do eksploatacji.
Hell_FollowArmyTargets=Szkol do celów Armii podczas wydarzenia piekielnego
Hell_FollowArmyTargetsTip=Podczas szkoleniowego wydarzenia piekielnego zatrzymaj się na celach jednostek z karty Armia, zamiast szkolić pełne koszary każdego docelowego typu dla maksymalnej liczby punktów.
Hell_KindTrain=Szkolenie
