Hell_Auto=Автоматические адские события
Hell_AutoTip=Во время адского события отмеченного вида занимает эту очередь работой (тренировка, исследование, строительство, создание пактов, ловушки, охота), пока не будет достигнута целевая фаза, даже если эта опция выключена в других местах. Событие тренировки тренирует полные казармы за раз (типы войск с вкладки Армия, без её лимита партии и целей).
Hell_TargetPhase=до фазы
Hell_UseSpeedUps=Ускорения для адских событий
Hell_UseSpeedUpsTip=Ускоряет соответствующую очередь, чтобы работа завершилась в рамках события, по одному элементу, и останавливается по достижении целевой фазы.
Hell_GeneralSpeedUps=Также универсальные ускорения
Hell_GeneralSpeedUpsTip=Позволяет ускорениям адских событий использовать универсальные ускорения на тренировке, исследованиях и ловушках, даже если "Использовать универсальные ускорения только для построек" бережёт их для строительства.
Hell_WhileGathering=Работать во время сбора
Hell_WhileGatheringTip=Когда надет шмот для сбора, бот ждёт возвращения сборщиков перед тренировкой, исследованием, строительством, созданием пактов или охотой, чтобы шмот оставался надетым. Во время адского события он всё равно работает над событием и не снимает шмот для сбора.
Hell_FollowArmyTargets=Обучать до целей вкладки «Армия» во время Адского события
Hell_FollowArmyTargetsTip=Во время адского события обучения останавливаться на целях войск из вкладки «Армия», а не обучать полную казарму каждого нужного типа ради максимума очков.
Hell_KindTrain=Тренировка
Hell_KindResearch=Исследование
Hell_KindBuild=Строительство
Hell_KindPacts=Создание пактов
Hell_KindTraps=Ловушки
Hell_KindHunt=Охота на монстров
Hell_SpeedUp=[Ад] {0}: ускорение (фаза {1} из {2})
Hell_MedalFilter=Только для медалей
Hell_MedalFilterTip=Запускать адское событие, только если среди его наград до целевой фазы есть медаль одного из этих героев. Оставьте это поле и материалы пустыми, чтобы запускать все адские события. Задание "Завершить фазу 3" из Поручений Гильдии или Феерии всё равно выполняется. В списке герои, чьи медали предлагали адские события за последние 60 дней (все герои, пока бот не увидел награды адского события).
Hell_Materials=или материалов
Hell_MaterialsTip=Или запускать адское событие, если среди его наград до целевой фазы есть один из этих материалов. Если выбрана медаль или материал, все остальные адские события пропускаются.
Hell_MedalAny=Любой герой
Hell_SkipNoMedal=[Ад] {0}: в наградах нет нужной медали или материала, пропускаем
Hell_MedalFound=[Ад] {0}: награды включают {1}
Hell_GemFinish=Завершать стройку самоцветами
Hell_GemFinishMax=макс. самоцветов на стройку
Hell_GemFinishTip=Во время адского события на строительство стройка, которая ещё шла бы к концу события, завершается самоцветами, если стоит не больше этого лимита. Нужно включить "Использовать самоцветы" в Расходах. Ускорения (если отмечены) используются первыми.
Hell_GemFinished=[Ад] {0}: {1} завершено за {2} самоцветов (фаза {3} из {4})
Hell_GemFinishOverLimit=[Ад] {0}: для завершения {1} нужно {2} самоцветов, больше вашего лимита {3}
Hell_GemFinishNoGems=[Ад] {0}: не хватает самоцветов, чтобы завершить {1} (нужно {2})
Hell_GemFinishNotAllowed=[Ад] {0}: {1} не завершается самоцветами, "Использовать самоцветы" выключено в Расходах
Hell_GatherHold=[Ад] {0}: ожидание, пока сборщики в пути, чтобы шмот для сбора оставался надетым. Отметьте "{1}" в адских событиях, чтобы работать над событием в шмоте для сбора
Hell_NothingToTrain=[Ад] {0}: нечего тренировать. Задайте тип войск с целью больше 0 для этой главы на вкладке Армия
Hell_NoSpeedUps=[Ад] {0}: в сумке нет ускорений, подходящих для этой очереди
Hell_SpeedUpsShort=[Ад] {0}: без ускорения, осталось {1}, и даже с ускорениями это продлится дольше конца события ({2})
Hell_NoSpeedUpsGeneralKept=[Ад] {0}: в сумке нет ускорений этого вида, а универсальные ускорения берегутся для строительства. Отметьте "{1}" в адских событиях, чтобы использовать их
Exchange_AutomateQuests=Автоматизировать квесты
Quest_AutomateTip=Пока квест активен, бот работает над ним: тренирует, исследует, создаёт пакты или камни навыка, куёт, охотится, использует Звёзды и Жетоны удачи, запускает Лабиринт/Сокровищницу, открывает сундуки артефактов, выполняет квесты дня/гильдии и адские события, даже если эти опции выключены.
Quest_UseSpeedUps=Разрешить квестам ускорения
Quest_UseSpeedUpsTip=Для квестов «Использовать ускорения» / «Ускорить создание» ускоряет очередь исследования, тренировки, строительства или создания.
Quest_TypesTab=Автоматизировать квесты
Quest_TypesHint=Снимите отметку с типа заданий, чтобы выполнять его самому. Лимит зависит от типа: для предметов это сколько бот оставляет неиспользованными, для заданий на монстров — процент энергии, которого ждёт охота. Также действует для миссий Поручений Гильдии, которые принимает бот.
Quest_ColQuest=Квест
Quest_ColAutomate=Авто
