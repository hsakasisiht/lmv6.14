Quest_AllOff=Ничего не автоматизировать
GuildFest_StrictSlotOrder=Сначала 200%, затем 120%
GuildFest_StrictSlotOrderTip=Сначала брать квесты для слота 200%, затем 120%, затем с доски гильдии. Сочетайте с Сначала соло, чтобы не брать с доски, пока есть бонусные попытки.
GuildFest_MailGuild=Отправить письмо всей гильдии
GuildFest_MailGuildRank=[GF] Для письма гильдии нужен ранг R2 или выше.
