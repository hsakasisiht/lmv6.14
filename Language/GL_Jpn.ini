Hell_AutoTip=チェックした種類の地獄級イベント中、オフになっている他の設定に関係なく、目標フェーズに達するまでそのキュー（訓練、研究、建設、召喚の書の精製、罠、討伐）を稼働させ続けます。訓練イベントでは毎回兵舎を満員まで訓練します（軍タブの兵種を使用し、バッチ上限と目標は無視）。
