Hell_FollowArmyTargets=地獄級イベント中はアーミーの目標まで訓練
Hell_FollowArmyTargetsTip=地獄級の訓練イベント中、最大ポイントのために対象タイプごとに兵営を満杯に訓練するのではなく、アーミータブの兵士目標で停止します。
