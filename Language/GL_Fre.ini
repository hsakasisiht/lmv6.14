Hell_MedalFilter=Uniquement pour les médailles de
Hell_MedalFilterTip=Ne lance un événement infernal que si ses récompenses, jusqu'à la phase cible, incluent une médaille de l'un de ces héros. Laissez ce champ et les matériaux vides pour lancer tous les événements infernaux. Une quête "Terminer la phase 3" de Guilde Fest ou d'Échange est quand même lancée. Liste les héros dont les médailles ont été proposées par les événements infernaux ces 60 derniers jours (tous les héros tant que le bot n'a pas vu les récompenses d'un événement infernal).
Hell_Materials=ou matériaux
Hell_MaterialsTip=Ou lance un événement infernal dont les récompenses, jusqu'à la phase cible, incluent l'un de ces matériaux. Dès qu'une médaille ou un matériau est choisi, tous les autres événements infernaux sont ignorés.
