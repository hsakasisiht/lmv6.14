Hell_SkipNoMedal=[Infernal] {0} : aucune médaille ni aucun matériau voulu dans les récompenses, celui-ci est ignoré
Hell_MedalFound=[Infernal] {0} : les récompenses incluent {1}
Hell_GemFinish=Terminer les constructions avec des gemmes
Hell_GemFinishMax=gemmes max par construction
Hell_GemFinishTip=Pendant un événement infernal de construction, une construction qui serait encore en cours à la fin de l'événement est terminée avec des gemmes, si elle ne coûte pas plus que cette limite. Nécessite "Utiliser les gemmes" dans Dépenses. Les accélérations (si cochées) sont utilisées d'abord.
Hell_GemFinished=[Infernal] {0} : {1} terminé avec {2} gemmes (phase {3} sur {4})
Hell_GemFinishOverLimit=[Infernal] {0} : {1} nécessite {2} gemmes pour terminer, plus que votre limite de {3}
Hell_GemFinishNoGems=[Infernal] {0} : pas assez de gemmes pour terminer {1} ({2} nécessaires)
Hell_GemFinishNotAllowed=[Infernal] {0} : {1} n'est pas terminé avec des gemmes, "Utiliser les gemmes" est désactivé dans Dépenses
Hell_GatherHold=[Infernal] {0} : en attente pendant que les récolteurs sont dehors, pour garder l'équipement de récolte. Cochez "{1}" dans Événements infernaux pour traiter l'événement avec l'équipement de récolte
Hell_NothingToTrain=[Infernal] {0} : rien à entraîner. Définissez un type de troupe avec un objectif supérieur à 0 pour ce chapitre dans l'onglet Armée
Hell_NoSpeedUps=[Infernal] {0} : aucune accélération dans le sac ne convient à cette file
Hell_SpeedUpsShort=[Infernal] {0} : pas d'accélération, il reste {1} et les accélérations ne suffiraient pas à finir avant la fin de l'événement ({2})
Hell_NoSpeedUpsGeneralKept=[Infernal] {0} : aucune accélération de ce type dans le sac, et les accélérations générales sont gardées pour la construction. Cochez "{1}" dans Événements infernaux pour les utiliser
