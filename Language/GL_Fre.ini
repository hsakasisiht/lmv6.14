Hell_Auto=Événements infernaux auto
Hell_AutoTip=Pendant un événement infernal d'un type coché, occupe cette file (entraînement, recherche, construction, fusion de pactes, pièges, chasse) jusqu'à la phase cible, même si cette option est désactivée ailleurs. Un événement d'entraînement entraîne une caserne pleine à chaque fois (les types de troupes de l'onglet Armée, sans sa limite de lot ni ses objectifs).
Hell_TargetPhase=jusqu'à la phase
Hell_UseSpeedUps=Utiliser des accélérations pour les événements infernaux
Hell_UseSpeedUpsTip=Accélère la file correspondante pour que le travail se termine pendant l'événement, un élément à la fois, et s'arrête une fois la phase cible atteinte.
Hell_GeneralSpeedUps=Aussi les accélérations générales
Hell_GeneralSpeedUpsTip=Permet aux accélérations des événements infernaux d'utiliser les accélérations générales pour l'entraînement, la recherche et les pièges, même si "Utiliser uniquement des accél. normaux pour les bâtiments" les garde pour la construction.
Hell_WhileGathering=Travailler pendant la récolte
Hell_WhileGatheringTip=Avec l'équipement de récolte, le bot attend le retour des récolteurs avant d'entraîner, de rechercher, de construire, de fusionner des pactes ou de chasser, pour garder l'équipement. Pendant un événement infernal, il traite quand même l'événement et garde l'équipement de récolte.
Hell_FollowArmyTargets=Entraîner selon les objectifs d'Armée pendant l'Événement infernal
Hell_FollowArmyTargetsTip=Pendant un événement d'entraînement infernal, s'arrêter aux objectifs de troupes de votre onglet Armée au lieu d'entraîner une caserne pleine de chaque type visé pour un maximum de points.
