Hell_Auto=Höllenevents automatisch
Hell_AutoTip=Während eines Höllenevents einer angehakten Art hält es diese Warteschlange beschäftigt (Training, Forschung, Bau, Paktfusion, Fallen, Jagd), bis die Zielphase erreicht ist, auch wenn die Option sonst aus ist. Ein Trainingsevent trainiert jedes Mal eine volle Kaserne (die Truppentypen aus dem Tab Armee/Fallen, ohne dessen Stapellimit und Ziele).
Hell_TargetPhase=bis Phase
Hell_UseSpeedUps=Beschleuniger für Höllenevents nutzen
Hell_UseSpeedUpsTip=Beschleunigt die passende Warteschlange, damit die Arbeit innerhalb des Events fertig wird, jeweils ein Eintrag, und stoppt bei Erreichen der Zielphase.
Hell_GeneralSpeedUps=Auch allgemeine Beschleuniger
Hell_GeneralSpeedUpsTip=Lässt Höllenevent-Beschleuniger allgemeine Beschleuniger für Training, Forschung und Fallen nutzen, auch wenn "Normale Beschleuniger nur für Gebäude nutzen" sie für den Bau aufhebt.
Hell_WhileGathering=Beim Sammeln arbeiten
Hell_WhileGatheringTip=Mit angelegter Sammelausrüstung wartet der Bot auf die Rückkehr der Sammler, bevor er trainiert, erforscht, baut, Pakte fusioniert oder jagt, damit die Ausrüstung angelegt bleibt. Während eines Höllenevents bearbeitet er das Event trotzdem und lässt die Sammelausrüstung an.
Hell_FollowArmyTargets=Im Höllenevent auf Armee-Ziele trainieren
Hell_FollowArmyTargetsTip=Während eines Höllen-Trainingsevents bei den Truppenzielen deines Armee-Reiters stoppen, statt für maximale Punkte eine volle Kaserne jedes Zieltyps zu trainieren.
Hell_KindTrain=Training
Hell_KindResearch=Forschung
Hell_KindBuild=Bau
Hell_KindPacts=Paktfusion
Hell_KindTraps=Fallen
Hell_KindHunt=Monsterjagd
Hell_SpeedUp=[Hölle] {0}: beschleunige (Phase {1} von {2})
Hell_MedalFilter=Nur für Medaillen von
Hell_MedalFilterTip=Höllenevent nur ausführen, wenn seine Belohnungen bis zur Zielphase eine Medaille eines dieser Helden enthalten. Dieses Feld und die Materialien leer lassen, um jedes Höllenevent auszuführen. Eine Gildenfest- oder Tausch-Quest "Phase 3 abschließen" wird trotzdem ausgeführt. Listet die Helden, deren Medaillen Höllenevents in den letzten 60 Tagen angeboten haben (alle Helden, bis der Bot die Belohnungen eines Höllenevents gesehen hat).
Hell_Materials=oder Materialien
Hell_MaterialsTip=Oder führt ein Höllenevent aus, dessen Belohnungen bis zur Zielphase eines dieser Materialien enthalten. Ist eine Medaille oder ein Material gewählt, werden alle anderen Höllenevents übersprungen.
Hell_MedalAny=Beliebiger Held
Hell_SkipNoMedal=[Hölle] {0}: keine gewünschte Medaille und kein gewünschtes Material in den Belohnungen, wird übersprungen
Hell_MedalFound=[Hölle] {0}: Belohnungen enthalten {1}
Hell_GemFinish=Bauten mit Edelsteinen abschließen
Hell_GemFinishMax=max. Edelsteine pro Bau
Hell_GemFinishTip=Bei einem Bau-Höllenevent wird ein Bau, der beim Ende des Events noch läuft, mit Edelsteinen abgeschlossen, wenn er nicht mehr als dieses Limit kostet. Benötigt "Edelsteine benutzen" unter Ausgaben. Beschleuniger (falls aktiviert) werden zuerst genutzt.
Hell_GemFinished=[Hölle] {0}: {1} mit {2} Edelsteinen abgeschlossen (Phase {3} von {4})
Hell_GemFinishOverLimit=[Hölle] {0}: {1} braucht {2} Edelsteine zum Abschließen, mehr als dein Limit von {3}
Hell_GemFinishNoGems=[Hölle] {0}: nicht genug Edelsteine, um {1} abzuschließen ({2} nötig)
Hell_GemFinishNotAllowed=[Hölle] {0}: {1} wird nicht mit Edelsteinen abgeschlossen, "Edelsteine benutzen" ist unter Ausgaben aus
Hell_GatherHold=[Hölle] {0}: warte, solange Sammler unterwegs sind, damit die Sammelausrüstung angelegt bleibt. "{1}" in Höllenevents anhaken, um das Event mit Sammelausrüstung zu bearbeiten
Hell_NothingToTrain=[Hölle] {0}: nichts zu trainieren. Im Tab Armee/Fallen einen Truppentyp mit Ziel über 0 für dieses Kapitel festlegen
Hell_NoSpeedUps=[Hölle] {0}: keine passenden Beschleuniger für diese Warteschlange im Beutel
Hell_SpeedUpsShort=[Hölle] {0}: keine Beschleunigung, {1} übrig und auch mit Beschleunigern liefe es über das Eventende hinaus ({2})
Hell_NoSpeedUpsGeneralKept=[Hölle] {0}: keine Beschleuniger dieser Art im Beutel, und allgemeine Beschleuniger werden für den Bau aufgehoben. "{1}" in Höllenevents anhaken, um sie zu nutzen
Exchange_AutomateQuests=Quests automatisieren
Quest_AutomateTip=Solange die Quest aktiv ist, arbeitet der Bot daran: trainiert, erforscht, fusioniert Pakte oder Fähigkeitssteine, schmiedet, jagt, nutzt Heilige Sterne und Glückstokens, führt Labyrinth/Tycoon aus, öffnet Artefakttruhen, erledigt Admin-/Gilden-Quests und Höllenevents, auch wenn diese Optionen aus sind.
Quest_UseSpeedUps=Quests dürfen Beschleuniger nutzen
Quest_UseSpeedUpsTip=Bei Quests "Beschleuniger nutzen" / "Fusion beschleunigen" wird die Warteschlange für Forschung, Training, Bau oder Fusion beschleunigt.
Quest_TypesTab=Quests automatisieren
Quest_TypesHint=Entferne den Haken bei einem Auftragstyp, um ihn selbst zu erledigen. Die Grenze hängt vom Typ ab: Bei Gegenständen ist es die Menge, die der Bot unbenutzt lässt, bei Monster-Aufträgen der Energie-%, auf den die Jagd wartet. Gilt auch für die Gildenfest-Missionen, die der Bot annimmt.
