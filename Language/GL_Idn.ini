Hell_Auto=Acara Neraka otomatis
Hell_AutoTip=Selama Acara Neraka dengan jenis yang dicentang, menjaga antrean itu tetap sibuk (pelatihan, riset, bangunan, merge pact, jebakan, perburuan) sampai fase target tercapai, meski opsi itu mati di tempat lain. Acara pelatihan melatih barak penuh setiap kali (jenis pasukan dari tab Pasukan, tanpa batas batch dan targetnya).
Hell_TargetPhase=hingga fase
Hell_UseSpeedUps=Pakai percepatan untuk Acara Neraka
Hell_UseSpeedUpsTip=Mempercepat antrean yang sesuai agar pekerjaan selesai dalam acara, satu per satu, dan berhenti setelah fase target tercapai.
Hell_GeneralSpeedUps=Juga percepatan umum
Hell_GeneralSpeedUpsTip=Membolehkan percepatan Acara Neraka memakai percepatan umum untuk pelatihan, riset, dan jebakan, meski "Gunakan Percepatan Normal Saja untuk Pembangunan" menyimpannya untuk pembangunan.
Hell_WhileGathering=Bekerja saat mengumpulkan
Hell_WhileGatheringTip=Dengan perlengkapan pengumpulan terpasang, bot menunggu pengumpul kembali sebelum melatih, riset, membangun, merge pact, atau berburu, agar perlengkapan tetap terpasang. Selama Acara Neraka bot tetap mengerjakan acara dan menjaga perlengkapan pengumpulan terpasang.
Hell_FollowArmyTargets=Latih sesuai target Pasukan saat Acara Neraka
Hell_FollowArmyTargetsTip=Selama acara pelatihan Neraka, berhenti pada target pasukan di tab Pasukan Anda alih-alih melatih barak penuh untuk setiap tipe sasaran demi poin maksimal.
Hell_KindTrain=Pelatihan
Hell_KindResearch=Riset
Hell_KindBuild=Bangunan
Hell_KindPacts=Merge Pact
Hell_KindTraps=Jebakan
Hell_KindHunt=Perburuan monster
Hell_SpeedUp=[Neraka] {0}: mempercepat (fase {1} dari {2})
Hell_MedalFilter=Hanya untuk medali
Hell_MedalFilterTip=Jalankan Acara Neraka hanya jika hadiahnya, sampai fase target, mencakup medali salah satu hero ini. Kosongkan ini dan bahan untuk menjalankan semua Acara Neraka. Misi "Selesaikan fase 3" Festival Klan atau Penukaran tetap dijalankan. Menampilkan hero yang medalinya ditawarkan Acara Neraka dalam 60 hari terakhir (semua hero sampai bot melihat hadiah Acara Neraka).
Hell_Materials=atau bahan
Hell_MaterialsTip=Atau jalankan Acara Neraka yang hadiahnya, sampai fase target, mencakup salah satu bahan ini. Jika ada medali atau bahan yang dipilih, semua Acara Neraka lainnya dilewati.
Hell_MedalAny=Hero apa saja
