Hell_MedalFound=[Neraka] {0}: hadiah berisi {1}
Hell_GemFinish=Selesaikan bangunan dengan permata
Hell_GemFinishMax=maks permata per bangunan
Hell_GemFinishTip=Selama Acara Neraka bangunan, bangunan yang masih berjalan saat acara berakhir diselesaikan dengan permata, jika biayanya tidak lebih dari batas ini. Perlu "Gunakan Permata" di Pengeluaran. Percepatan (jika dicentang) dipakai lebih dulu.
Hell_GemFinished=[Neraka] {0}: {1} selesai dengan {2} permata (fase {3} dari {4})
Hell_GemFinishOverLimit=[Neraka] {0}: {1} butuh {2} permata untuk selesai, lebih dari batas Anda {3}
Hell_GemFinishNoGems=[Neraka] {0}: permata tidak cukup untuk menyelesaikan {1} (perlu {2})
Hell_GemFinishNotAllowed=[Neraka] {0}: {1} tidak diselesaikan dengan permata, "Gunakan Permata" mati di Pengeluaran
Hell_GatherHold=[Neraka] {0}: menunggu selama pengumpul masih keluar, agar perlengkapan pengumpulan tetap terpasang. Centang "{1}" di Acara Neraka untuk mengerjakan acara dengan perlengkapan pengumpulan
Hell_NothingToTrain=[Neraka] {0}: tidak ada yang dilatih. Atur jenis pasukan dengan target di atas 0 untuk chapter ini di tab Pasukan
Hell_NoSpeedUps=[Neraka] {0}: tidak ada percepatan di tas yang cocok untuk antrean ini
Hell_SpeedUpsShort=[Neraka] {0}: tidak mempercepat, sisa {1} dan percepatan tetap tidak akan selesai sebelum event berakhir ({2})
Hell_NoSpeedUpsGeneralKept=[Neraka] {0}: tidak ada percepatan jenis ini di tas, dan percepatan umum disimpan untuk pembangunan. Centang "{1}" di Acara Neraka untuk memakainya
Exchange_AutomateQuests=Otomatiskan misi
