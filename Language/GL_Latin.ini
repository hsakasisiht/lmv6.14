Hell_Auto=Eventos de infierno automáticos
Hell_AutoTip=Durante un evento de infierno de un tipo marcado, mantiene ocupada esa cola (entrenar, investigar, construir, fusionar pactos, trampas, cacería) hasta llegar a la fase objetivo, aunque esa opción esté desactivada en otro lugar. Un evento de entrenamiento entrena un cuartel lleno cada vez (los tipos de tropa de la pestaña Ejército, sin su límite por lote ni objetivos).
Hell_TargetPhase=hasta la fase
Hell_UseSpeedUps=Usar aceleraciones en eventos de infierno
Hell_UseSpeedUpsTip=Acelera la cola correspondiente para que el trabajo termine dentro del evento, un elemento a la vez, y se detiene al llegar a la fase objetivo.
Hell_GeneralSpeedUps=También aceleraciones generales
Hell_GeneralSpeedUpsTip=Permite que las aceleraciones de los eventos de infierno usen aceleraciones generales en entrenamiento, investigación y trampas, aunque "Usar solo aceleradores normales para construir" las reserve para construir.
Hell_WhileGathering=Trabajar mientras recolecta
Hell_WhileGatheringTip=Con el equipo de recolección puesto, el bot espera a que vuelvan los recolectores antes de entrenar, investigar, construir, fusionar pactos o cazar, para que el equipo siga puesto. Durante un evento de infierno trabaja el evento de todos modos y mantiene puesto el equipo de recolección.
Hell_FollowArmyTargets=Entrenar según objetivos de Ejército durante el Evento de infierno
Hell_FollowArmyTargetsTip=Durante un evento de entrenamiento de infierno, deténte en los objetivos de tropas de tu pestaña Ejército en lugar de entrenar un cuartel lleno de cada tipo buscado para obtener los máximos puntos.
Hell_KindTrain=Entrenamiento
Hell_KindResearch=Investigación
Hell_KindBuild=Construcción
Hell_KindPacts=Fusión de pactos
Hell_KindTraps=Trampas
Hell_KindHunt=Cacería de monstruos
Hell_SpeedUp=[Infierno] {0}: acelerando (fase {1} de {2})
Hell_MedalFilter=Solo para medallas de
Hell_MedalFilterTip=Solo ejecuta un evento de infierno cuando sus recompensas, hasta la fase objetivo, incluyen una medalla de uno de estos héroes. Deja este campo y los materiales vacíos para ejecutar todos los eventos de infierno. Una misión "Completar la fase 3" de Fiesta de Gremios o Intercambio se ejecuta igual. Lista los héroes cuyas medallas han ofrecido los eventos de infierno en los últimos 60 días (todos los héroes hasta que el bot vea las recompensas de un evento de infierno).
Hell_Materials=o materiales
Hell_MaterialsTip=O ejecuta un evento de infierno cuyas recompensas, hasta la fase objetivo, incluyan uno de estos materiales. Con una medalla o un material elegido, se omiten todos los demás eventos de infierno.
Hell_MedalAny=Cualquier héroe
Hell_SkipNoMedal=[Infierno] {0}: no hay medalla ni material deseado en las recompensas, se omite este
Hell_MedalFound=[Infierno] {0}: las recompensas incluyen {1}
Hell_GemFinish=Terminar construcciones con gemas
Hell_GemFinishMax=gemas máx. por construcción
Hell_GemFinishTip=Durante un evento de infierno de construcción, una construcción que seguiría en curso al terminar el evento se termina con gemas, si no cuesta más que este límite. Necesita "Usar Gemas" en Gastos. Las aceleraciones (si están marcadas) se usan primero.
Hell_GemFinished=[Infierno] {0}: {1} terminado con {2} gemas (fase {3} de {4})
Hell_GemFinishOverLimit=[Infierno] {0}: {1} necesita {2} gemas para terminar, más que tu límite de {3}
Hell_GemFinishNoGems=[Infierno] {0}: no hay gemas suficientes para terminar {1} (se necesitan {2})
Hell_GemFinishNotAllowed=[Infierno] {0}: {1} no se termina con gemas, "Usar Gemas" está desactivado en Gastos
Hell_GatherHold=[Infierno] {0}: esperando mientras los recolectores están fuera, para que el equipo de recolección siga puesto. Marca "{1}" en Eventos de infierno para trabajar el evento con el equipo de recolección
Hell_NothingToTrain=[Infierno] {0}: nada que entrenar. Define un tipo de tropa con objetivo mayor que 0 para este capítulo en la pestaña Ejército
Hell_NoSpeedUps=[Infierno] {0}: no hay aceleraciones en la bolsa que sirvan para esta cola
Hell_SpeedUpsShort=[Infierno] {0}: sin acelerar, quedan {1} y aun con aceleraciones seguiría después del fin del evento ({2})
Hell_NoSpeedUpsGeneralKept=[Infierno] {0}: no hay aceleraciones de este tipo en la bolsa, y las aceleraciones generales se reservan para construir. Marca "{1}" en Eventos de infierno para usarlas
Exchange_AutomateQuests=Automatizar misiones
Quest_AutomateTip=Mientras la misión esté activa, el bot trabaja en ella: entrena, investiga, fusiona pactos o piedras de habilidad, forja, caza, usa Estrellas sagradas y Amuletos, ejecuta Laberinto/Magnate, abre cofres de artefacto, completa misiones admin./de gremio y eventos de infierno, aunque esas opciones estén desactivadas.
