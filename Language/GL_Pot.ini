Hell_Auto=Eventos Infernais automáticos
Hell_AutoTip=Durante um Evento Infernal de um tipo marcado, mantém essa fila ocupada (treinar, pesquisar, construir, fundir pactos, armadilhas, caçar) até atingir a fase alvo, mesmo que essa opção esteja desligada em outro lugar. Um evento de treinamento treina um quartel cheio a cada vez (os tipos de tropa da aba Exército, sem o limite de lote nem as metas).
Hell_TargetPhase=até a fase
Hell_UseSpeedUps=Usar acelerações nos Eventos Infernais
Hell_UseSpeedUpsTip=Acelera a fila correspondente para o trabalho terminar dentro do evento, um item por vez, e para ao atingir a fase alvo.
Hell_GeneralSpeedUps=Também acelerações gerais
Hell_GeneralSpeedUpsTip=Permite que as acelerações dos Eventos Infernais usem acelerações gerais em treinamento, pesquisa e armadilhas, mesmo quando "Usar acelerações normais apenas para construção" as reserva para construção.
Hell_WhileGathering=Trabalhar durante a coleta
Hell_WhileGatheringTip=Com o equipamento de coleta, o bot espera os coletores voltarem antes de treinar, pesquisar, construir, fundir pactos ou caçar, para manter o equipamento. Durante um Evento Infernal ele trabalha no evento mesmo assim e mantém o equipamento de coleta.
Hell_FollowArmyTargets=Treinar conforme as metas de Exército durante o Evento Infernal
Hell_FollowArmyTargetsTip=Durante um evento de treino infernal, parar nas metas de tropas da aba Exército em vez de treinar um quartel cheio de cada tipo visado para pontuação máxima.
Hell_KindTrain=Treinamento
Hell_KindResearch=Pesquisa
Hell_KindBuild=Construção
Hell_KindPacts=Fusão de pactos
Hell_KindTraps=Armadilhas
Hell_KindHunt=Caça a monstros
Hell_SpeedUp=[Infernal] {0}: acelerando (fase {1} de {2})
Hell_MedalFilter=Somente para medalhas de
Hell_MedalFilterTip=Só executa um Evento Infernal quando suas recompensas, até a fase alvo, incluem uma medalha de um destes heróis. Deixe este campo e os materiais vazios para executar todos os Eventos Infernais. Uma missão "Concluir a fase 3" do Festival das Guildas ou Troca ainda é executada. Lista os heróis cujas medalhas os Eventos Infernais ofereceram nos últimos 60 dias (todos os heróis até o bot ver as recompensas de um Evento Infernal).
Hell_Materials=ou materiais
Hell_MaterialsTip=Ou executa um Evento Infernal cujas recompensas, até a fase alvo, incluam um destes materiais. Com uma medalha ou material escolhido, todos os outros Eventos Infernais são ignorados.
Hell_MedalAny=Qualquer herói
Hell_SkipNoMedal=[Infernal] {0}: nenhuma medalha ou material desejado nas recompensas, pulando este
Hell_MedalFound=[Infernal] {0}: recompensas incluem {1}
Hell_GemFinish=Concluir construções com gemas
Hell_GemFinishMax=máx. de gemas por construção
Hell_GemFinishTip=Durante um Evento Infernal de construção, uma construção que ainda estaria em andamento ao fim do evento é concluída com gemas, se não custar mais que este limite. Requer "Usar Gemas" em Gastos. Acelerações (se marcadas) são usadas primeiro.
Hell_GemFinished=[Infernal] {0}: {1} concluído com {2} gemas (fase {3} de {4})
Hell_GemFinishOverLimit=[Infernal] {0}: {1} precisa de {2} gemas para concluir, mais que seu limite de {3}
Hell_GemFinishNoGems=[Infernal] {0}: gemas insuficientes para concluir {1} ({2} necessárias)
Hell_GemFinishNotAllowed=[Infernal] {0}: {1} não será concluído com gemas, "Usar Gemas" está desligado em Gastos
Hell_GatherHold=[Infernal] {0}: aguardando enquanto os coletores estão fora, para manter o equipamento de coleta. Marque "{1}" em Eventos Infernais para trabalhar o evento com o equipamento de coleta
Hell_NothingToTrain=[Infernal] {0}: nada para treinar. Defina um tipo de tropa com meta acima de 0 para este capítulo na aba Exército
Hell_NoSpeedUps=[Infernal] {0}: nenhuma aceleração na bolsa que sirva para esta fila
Hell_SpeedUpsShort=[Infernal] {0}: sem acelerar, faltam {1} e mesmo com acelerações passaria do fim do evento ({2})
Hell_NoSpeedUpsGeneralKept=[Infernal] {0}: nenhuma aceleração deste tipo na bolsa, e as acelerações gerais são reservadas para construção. Marque "{1}" em Eventos Infernais para usá-las
Exchange_AutomateQuests=Automatizar missões
Quest_AutomateTip=Enquanto a missão estiver ativa, o bot trabalha nela: treina, pesquisa, funde pactos ou pedras de habilidade, forja, caça, usa Estrelas Sagradas e Fichas da Sorte, executa Labirinto/Magnata, abre baús de artefato, conclui missões Admin/da Guilda e Eventos Infernais, mesmo com essas opções desligadas.
