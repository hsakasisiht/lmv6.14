Hell_Auto=Автоматичні пекельні події
Hell_AutoTip=Під час пекельної події позначеного виду тримає цю чергу зайнятою (навчання, вивчення, будівництво, створення пактів, пастки, полювання), доки не буде досягнуто цільової фази, навіть якщо цю опцію вимкнено деінде. Подія навчання навчає повні казарми щоразу (типи військ з вкладки Армія, без її ліміту партії та цілей).
Hell_TargetPhase=до фази
Hell_UseSpeedUps=Прискорення для пекельних подій
Hell_UseSpeedUpsTip=Прискорює відповідну чергу, щоб робота завершилася в межах події, по одному елементу, і зупиняється після досягнення цільової фази.
Hell_GeneralSpeedUps=Також загальні прискорення
Hell_GeneralSpeedUpsTip=Дозволяє прискоренням пекельних подій використовувати загальні прискорення на навчанні, вивченні та пастках, навіть коли "Використовувати звичайні прискори лише для будівництва" залишає їх для будівництва.
Hell_WhileGathering=Працювати під час збору
Hell_WhileGatheringTip=Коли вдягнено шмот збору, бот чекає на повернення збирачів перед навчанням, вивченням, будівництвом, створенням пактів чи полюванням, щоб шмот залишався вдягненим. Під час пекельної події він усе одно працює над подією й не знімає шмот збору.
Hell_FollowArmyTargets=Тренувати до цілей вкладки «Армія» під час Пекельної події
Hell_FollowArmyTargetsTip=Під час пекельної події тренування зупиняйтеся на цілях військ із вкладки «Армія», а не тренуйте повну казарму кожного потрібного типу заради максимуму очок.
