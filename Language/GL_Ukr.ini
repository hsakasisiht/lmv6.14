Hell_SpeedUp=[Пекло] {0}: прискорення (фаза {1} з {2})
Hell_MedalFilter=Лише для медалей
Hell_MedalFilterTip=Запускати пекельну подію, лише якщо серед її нагород до цільової фази є медаль одного з цих героїв. Залиште це поле й матеріали порожніми, щоб запускати всі пекельні події. Завдання "Завершити фазу 3" Доручень гільдії або Обміну все одно виконується. У списку герої, медалі яких пропонували пекельні події за останні 60 днів (усі герої, доки бот не побачив нагороди пекельної події).
Hell_Materials=або матеріалів
Hell_MaterialsTip=Або запускати пекельну подію, якщо серед її нагород до цільової фази є один із цих матеріалів. Якщо вибрано медаль або матеріал, усі інші пекельні події пропускаються.
Hell_MedalAny=Будь-який герой
Hell_SkipNoMedal=[Пекло] {0}: у нагородах немає потрібної медалі чи матеріалу, пропускаємо
Hell_MedalFound=[Пекло] {0}: нагороди містять {1}
Hell_GemFinish=Завершувати будівництво сапфірами
Hell_GemFinishMax=макс. сапфірів на будівництво
Hell_GemFinishTip=Під час пекельної події будівництва будівля, яка ще будувалася б на кінець події, завершується сапфірами, якщо коштує не більше цього ліміту. Потрібно увімкнути "Використовуйте сапфіри" у Витратах. Прискорення (якщо позначено) використовуються спершу.
