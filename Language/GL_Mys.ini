Hell_MedalFilter=Hanya untuk pingat
Hell_MedalFilterTip=Jalankan Acara Neraka hanya apabila ganjarannya, sehingga fasa sasaran, mengandungi pingat salah seorang wira ini. Biarkan ini dan bahan kosong untuk menjalankan setiap Acara Neraka. Pencarian "Lengkapkan fasa 3" Festival Persatuan atau Pertukaran tetap dijalankan. Menyenaraikan wira yang pingatnya ditawarkan oleh Acara Neraka dalam 60 hari lepas (semua wira sehingga bot melihat ganjaran Acara Neraka).
Hell_Materials=atau bahan
Hell_MaterialsTip=Atau jalankan Acara Neraka yang ganjarannya, sehingga fasa sasaran, mengandungi salah satu bahan ini. Jika mana-mana pingat atau bahan dipilih, semua Acara Neraka lain dilangkau.
