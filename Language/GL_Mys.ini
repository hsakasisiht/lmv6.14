Hell_GemFinishMax=maks permata setiap bangunan
Hell_GemFinishTip=Semasa Acara Neraka bangunan, bangunan yang masih berjalan apabila acara tamat disiapkan dengan permata, jika kosnya tidak melebihi had ini. Perlukan "Guna Permata" dalam Perbelanjaan. Penambah kelajuan (jika ditanda) digunakan dahulu.
