Hell_GatherHold=[Neraka] {0}: menunggu sementara pengumpul berada di luar, supaya peralatan pengumpulan kekal dipakai. Tanda "{1}" dalam Acara Neraka untuk mengerjakan acara dengan peralatan pengumpulan
Hell_NothingToTrain=[Neraka] {0}: tiada apa untuk dilatih. Tetapkan jenis tentera dengan sasaran melebihi 0 untuk bab ini dalam tab Tentera
Hell_NoSpeedUps=[Neraka] {0}: tiada penambah kelajuan dalam beg yang sesuai untuk baris gilir ini
