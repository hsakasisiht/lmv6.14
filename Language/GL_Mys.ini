Hell_Auto=Acara Neraka automatik
Hell_AutoTip=Semasa Acara Neraka bagi jenis yang ditanda, memastikan baris gilir itu sentiasa bekerja (latihan, penyelidikan, bangunan, penggabungan pakatan, perangkap, pemburuan) sehingga fasa sasaran dicapai, walaupun pilihan itu dimatikan di tempat lain. Acara latihan melatih satu berek penuh setiap kali (jenis tentera daripada tab Tentera, tanpa had kelompok atau sasarannya).
Hell_TargetPhase=sehingga fasa
Hell_UseSpeedUps=Guna penambah kelajuan untuk Acara Neraka
Hell_UseSpeedUpsTip=Mempercepat baris gilir yang sepadan supaya kerja siap dalam acara, satu item pada satu masa, dan berhenti setelah fasa sasaran dicapai.
Hell_GeneralSpeedUps=Juga penambah kelajuan am
Hell_GeneralSpeedUpsTip=Membenarkan penambah kelajuan Acara Neraka menggunakan penambah kelajuan am untuk latihan, penyelidikan dan perangkap, walaupun "Guna Pemercepat Biasa Sahaja untuk Pembinaan" menyimpannya untuk pembinaan.
Hell_WhileGathering=Bekerja semasa mengumpul
Hell_WhileGatheringTip=Dengan peralatan pengumpulan dipakai, bot menunggu pengumpul pulang sebelum melatih, menyelidik, membina, menggabung pakatan atau memburu, supaya peralatan kekal dipakai. Semasa Acara Neraka, bot tetap mengerjakan acara itu dan mengekalkan peralatan pengumpulan.
Hell_FollowArmyTargets=Latih ikut sasaran Tentera semasa Acara Neraka
Hell_FollowArmyTargetsTip=Semasa acara latihan Neraka, berhenti pada sasaran tentera di tab Tentera anda dan bukannya melatih berek penuh bagi setiap jenis disasarkan untuk mata maksimum.
