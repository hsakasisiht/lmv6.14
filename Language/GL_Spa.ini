Hell_Auto=Eventos de infierno automáticos
Hell_AutoTip=Durante un evento de infierno de un tipo marcado, mantiene esa cola ocupada (entrenar, investigar, construir, fusionar pactos, trampas, cazar) hasta alcanzar la fase objetivo, aunque esa opción esté desactivada en otro sitio. Un evento de entrenamiento entrena un cuartel lleno cada vez (los tipos de tropa de la pestaña Ejército, sin su límite de lote ni objetivos).
Hell_TargetPhase=hasta la fase
Hell_UseSpeedUps=Usar aceleraciones en eventos de infierno
Hell_UseSpeedUpsTip=Acelera la cola correspondiente para que el trabajo termine dentro del evento, un elemento a la vez, y se detiene al llegar a la fase objetivo.
Hell_GeneralSpeedUps=También aceleraciones generales
Hell_GeneralSpeedUpsTip=Permite que las aceleraciones de los eventos de infierno usen aceleraciones generales en entrenamiento, investigación y trampas, incluso cuando "Usar solo aceleradores normales para construir" las reserva para construir.
Hell_WhileGathering=Trabajar mientras se recolecta
Hell_WhileGatheringTip=Con la armadura de recolección puesta, el bot espera a que vuelvan los recolectores antes de entrenar, investigar, construir, fusionar pactos o cazar, para que la armadura siga puesta. Durante un evento de infierno trabaja en el evento igualmente y mantiene la armadura de recolección.
Hell_FollowArmyTargets=Entrenar según objetivos de Ejército durante el Evento de infierno
Hell_FollowArmyTargetsTip=Durante un evento de entrenamiento de infierno, deténte en los objetivos de tropas de tu pestaña Ejército en lugar de entrenar un cuartel lleno de cada tipo buscado para obtener los máximos puntos.
